<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Entry Anonymiser{% endblock %} · Global EdTech Awards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@600;700&family=Poppins:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
{% block head %}{% endblock %}
</head>
<body>
<header class="top">
  <a class="brand" href="{{ url_for('index') }}">Entry Anonymiser <span>Global EdTech Awards</span></a>
  {% if session.user %}
  <form method="post" action="{{ url_for('logout') }}"><button class="link">Sign out</button></form>
  {% endif %}
</header>
<main>
  {% for message in get_flashed_messages() %}<p class="flash">{{ message }}</p>{% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
